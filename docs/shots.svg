<svg xmlns="http://www.w3.org/2000/svg" width="920" height="252" viewBox="0 0 920 252" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="Cutting Chai shot timeline over 30 seconds">
  <defs>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1826"/><stop offset="1" stop-color="#241d2e"/>
    </linearGradient>
  </defs>
  <rect width="920" height="252" rx="18" fill="url(#b2)"/>
  <rect x="0.5" y="0.5" width="919" height="251" rx="18" fill="none" stroke="#3a3350"/>
  <text x="34" y="42" fill="#f6f1e6" font-size="17" font-weight="700">“Cutting Chai” — 30 s, four shots</text>

  <!-- bars -->
  <g>
    <rect x="34"   y="66" width="42"  height="34" rx="8" fill="#4a4166"/>
    <rect x="80"   y="66" width="196" height="34" rx="8" fill="#3f6d8f"/>
    <rect x="280"  y="66" width="10"  height="34" rx="4" fill="#7a5f2a"/>
    <rect x="294"  y="66" width="196" height="34" rx="8" fill="#8f4a5f"/>
    <rect x="494"  y="66" width="10"  height="34" rx="4" fill="#7a5f2a"/>
    <rect x="508"  y="66" width="196" height="34" rx="8" fill="#4a7a52"/>
    <rect x="708"  y="66" width="178" height="34" rx="8" fill="#8f6a3f"/>
  </g>
  <g fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">
    <text x="55"  y="88">title</text>
    <text x="178" y="88">walk-in</text>
    <text x="392" y="88">counter</text>
    <text x="606" y="88">the theft</text>
    <text x="797" y="88">payoff</text>
  </g>

  <!-- time labels -->
  <g fill="#8d84a8" font-size="11">
    <text x="34"  y="118">0s</text>
    <text x="276" y="118" text-anchor="end">8.7s</text>
    <text x="294" y="118">9.1s</text>
    <text x="504" y="118" text-anchor="end">23.6s</text>
    <text x="886" y="118" text-anchor="end">30s</text>
  </g>

  <!-- technique rows -->
  <g font-size="12.5" fill="#b6adc9">
    <text x="34" y="152">walk-in</text><text x="140" y="152" fill="#ffd94a">pose flip-book · parallax scroll · footsteps on stride</text>
    <text x="34" y="176">counter</text><text x="140" y="176" fill="#ffd94a">cut-out bust · mouth shapes driven by voice RMS</text>
    <text x="34" y="200">theft</text><text x="140" y="200" fill="#ffd94a">tea drops only on a visible lap · slurp SFX on the same beat</text>
    <text x="34" y="224">payoff</text><text x="140" y="224" fill="#ffd94a">camera shake · anger mark · comedy button · outro card</text>
  </g>
</svg>
