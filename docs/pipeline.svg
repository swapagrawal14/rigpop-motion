<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial" role="img" aria-label="rigpop-motion pipeline: generate poses, clean cutouts, normalise, play with timing, add camera and sound">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1826"/><stop offset="1" stop-color="#241d2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd94a"/><stop offset="1" stop-color="#e8695f"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d84a8"/>
    </marker>
  </defs>
  <rect width="920" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="919" height="299" rx="18" fill="none" stroke="#3a3350"/>

  <text x="34" y="46" fill="#f6f1e6" font-size="19" font-weight="700">From artwork to animation</text>
  <text x="34" y="70" fill="#9c93b6" font-size="13">no editing software · no API keys · one Node process</text>
  <rect x="34" y="82" width="120" height="4" rx="2" fill="url(#acc)"/>

  <!-- boxes -->
  <g>
    <rect x="34" y="112" width="150" height="126" rx="14" fill="#2a2338" stroke="#4a4166"/>
    <text x="109" y="146" fill="#ffd94a" font-size="26" text-anchor="middle">✏️</text>
    <text x="109" y="178" fill="#f6f1e6" font-size="14" font-weight="700" text-anchor="middle">generate</text>
    <text x="109" y="198" fill="#9c93b6" font-size="11.5" text-anchor="middle">6 walk poses</text>
    <text x="109" y="214" fill="#9c93b6" font-size="11.5" text-anchor="middle">any image model</text>
  </g>
  <g>
    <rect x="212" y="112" width="150" height="126" rx="14" fill="#2a2338" stroke="#4a4166"/>
    <text x="287" y="146" fill="#ffd94a" font-size="26" text-anchor="middle">✂️</text>
    <text x="287" y="178" fill="#f6f1e6" font-size="14" font-weight="700" text-anchor="middle">clean</text>
    <text x="287" y="198" fill="#9c93b6" font-size="11.5" text-anchor="middle">background out</text>
    <text x="287" y="214" fill="#9c93b6" font-size="11.5" text-anchor="middle">1px erosion + ink</text>
  </g>
  <g>
    <rect x="390" y="112" width="150" height="126" rx="14" fill="#2a2338" stroke="#4a4166"/>
    <text x="465" y="146" fill="#ffd94a" font-size="26" text-anchor="middle">📐</text>
    <text x="465" y="178" fill="#f6f1e6" font-size="14" font-weight="700" text-anchor="middle">normalise</text>
    <text x="465" y="198" fill="#9c93b6" font-size="11.5" text-anchor="middle">head axis</text>
    <text x="465" y="214" fill="#9c93b6" font-size="11.5" text-anchor="middle">sole baseline</text>
  </g>
  <g>
    <rect x="568" y="112" width="150" height="126" rx="14" fill="#2a2338" stroke="#4a4166"/>
    <text x="643" y="146" fill="#ffd94a" font-size="26" text-anchor="middle">🎞️</text>
    <text x="643" y="178" fill="#f6f1e6" font-size="14" font-weight="700" text-anchor="middle">play</text>
    <text x="643" y="198" fill="#9c93b6" font-size="11.5" text-anchor="middle">6 poses × 5 frames</text>
    <text x="643" y="214" fill="#9c93b6" font-size="11.5" text-anchor="middle">1.0 s cycle</text>
  </g>
  <g>
    <rect x="746" y="112" width="140" height="126" rx="14" fill="#33243a" stroke="#6b4a63"/>
    <text x="816" y="146" fill="#ffd94a" font-size="26" text-anchor="middle">🎬</text>
    <text x="816" y="178" fill="#f6f1e6" font-size="14" font-weight="700" text-anchor="middle">camera + sound</text>
    <text x="816" y="198" fill="#9c93b6" font-size="11.5" text-anchor="middle">pan · zoom · shake</text>
    <text x="816" y="214" fill="#9c93b6" font-size="11.5" text-anchor="middle">sync to the beat</text>
  </g>

  <!-- arrows -->
  <g stroke="#8d84a8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="186" y1="175" x2="208" y2="175"/>
    <line x1="364" y1="175" x2="386" y2="175"/>
    <line x1="542" y1="175" x2="564" y2="175"/>
    <line x1="720" y1="175" x2="742" y2="175"/>
  </g>

  <text x="34" y="272" fill="#7f779a" font-size="11.5">mp4 in → out</text>
  <text x="886" y="272" fill="#7f779a" font-size="11.5" text-anchor="end">Rigpop family · MIT</text>
</svg>
